<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Two Lanterns</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg1:#1b1340;--bg2:#3a1c52;--bg3:#0d0a26;--cream:#fff4dc;--ink:#2b1d3a;--gold:#ffd27a;--rose:#ff8fa8;--muted:#b9aedc;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;font-family:'Fraunces',Georgia,serif;color:var(--cream);background:radial-gradient(ellipse at 50% 0%,var(--bg2),var(--bg1) 55%,var(--bg3));background-attachment:fixed;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff 50%,transparent),radial-gradient(1px 1px at 78% 12%,#ffe9b0 50%,transparent),radial-gradient(2px 2px at 40% 30%,#fff 50%,transparent),radial-gradient(1px 1px at 90% 44%,#fff 50%,transparent),radial-gradient(1.5px 1.5px at 22% 62%,#ffe9b0 50%,transparent),radial-gradient(1px 1px at 65% 78%,#fff 50%,transparent),radial-gradient(2px 2px at 8% 90%,#fff 50%,transparent),radial-gradient(1.5px 1.5px at 85% 92%,#ffe9b0 50%,transparent);animation:tw 4s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.45}to{opacity:1}}
main{position:relative;max-width:460px;margin:0 auto;padding:20px 18px 28px;min-height:100vh;display:flex;flex-direction:column;gap:14px}
h1{font-size:2.3rem;margin:8px 0 0;text-align:center;font-weight:700;color:var(--gold);text-shadow:0 0 24px #ffb84d88}
h2{margin:0;font-size:1.35rem;color:var(--gold);text-align:center}
p{margin:0;line-height:1.45}
.sub{text-align:center;color:var(--muted);font-style:italic}
.lanterns{display:flex;justify-content:center;gap:18px;font-size:2.6rem;filter:drop-shadow(0 0 14px #ffc25c)}
.card{background:var(--cream);color:var(--ink);border-radius:18px;padding:14px 16px;box-shadow:0 6px 0 #c9b88f,0 10px 24px #0008}
.panel{background:#ffffff12;border:1px solid #ffffff25;border-radius:18px;padding:14px 16px}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
input{width:100%;font:inherit;font-size:1.1rem;padding:12px 14px;border-radius:12px;border:2px solid #ffffff30;background:#0d0a2699;color:var(--cream)}
input:focus{outline:none;border-color:var(--gold)}
.row{display:flex;gap:10px}
button{font:inherit;font-weight:700;font-size:1.05rem;border:0;border-radius:14px;padding:14px 16px;color:var(--ink);background:var(--gold);box-shadow:0 4px 0 #b88a2e;cursor:pointer;touch-action:manipulation}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #b88a2e}
button.alt{background:#ffffff1c;color:var(--cream);box-shadow:0 4px 0 #0006;border:1px solid #ffffff30}
button.sel{background:var(--rose);box-shadow:0 4px 0 #b34c66}
button.big{width:100%}
.side{flex:1;font-size:1.05rem}
.bar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.pip{width:14px;height:14px;border-radius:50%;background:#ffffff25}
.pip.on{background:var(--gold);box-shadow:0 0 10px var(--gold)}
.chap{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
.role{text-align:center;font-weight:700;padding:8px;border-radius:12px;background:#ffffff14}
.seq{display:flex;flex-direction:column;gap:8px}
.step{display:flex;align-items:center;gap:12px;font-size:1.25rem;padding:8px 12px;border-radius:12px;background:#0000000f;border:2px solid transparent}
.step .n{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--cream);font-size:.9rem;display:grid;place-items:center;flex:none}
.step .e{font-size:1.7rem}
.step.done{opacity:.4;text-decoration:line-through}
.step.now{border-color:var(--rose);background:#ff8fa826}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:.95rem}
.orbs{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:8px 0}
.orb{aspect-ratio:1;border-radius:50%;border:0;padding:0;box-shadow:inset -6px -8px 14px #0005,inset 6px 6px 12px #fff6,0 0 18px var(--c);background:radial-gradient(circle at 32% 28%,#fff9,var(--c) 55%);animation:bob 3s ease-in-out infinite}
.orb:nth-child(odd){animation-delay:-1.4s}
@keyframes bob{50%{transform:translateY(-6px)}}
.orb.ok{animation:pop .45s}
.orb.bad{animation:shake .45s;filter:grayscale(1)}
@keyframes pop{40%{transform:scale(1.25);box-shadow:0 0 40px var(--c),0 0 70px var(--c)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.hearts{text-align:center;color:var(--muted);font-size:.9rem}
.msg{text-align:center;min-height:1.4em;color:var(--rose);font-weight:700}
.win{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;margin-top:30px}
.win .big{font-size:4rem;animation:bob 3s ease-in-out infinite}
.note{font-size:.85rem;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);background:var(--rose);color:var(--ink);font-weight:700;padding:10px 18px;border-radius:999px;z-index:9;box-shadow:0 6px 20px #0008;animation:tin .4s}
@keyframes tin{from{opacity:0;transform:translate(-50%,-14px)}}
.top{display:flex;justify-content:space-between;align-items:center}
.mini{padding:6px 12px;font-size:.9rem;box-shadow:none}
details.panel summary{cursor:pointer;font-weight:700;color:var(--gold)}
details input{margin-top:8px;font-size:.95rem;padding:10px 12px}
.float{position:fixed;left:50%;bottom:30%;font-size:4rem;animation:fl 2s forwards;pointer-events:none;z-index:8}
@keyframes fl{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-140px) scale(1.6)}}
</style>
</head>
<body>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
var PAL=[
{e:"🌹",n:"Rose",c:"#e0264a",w:"crimson"},
{e:"🍑",n:"Peach",c:"#ff8a5c",w:"coral"},
{e:"💍",n:"Ring",c:"#ffc933",w:"gold"},
{e:"🌿",n:"Sprig",c:"#4ee0a0",w:"mint"},
{e:"☁️",n:"Cloud",c:"#6ec6ff",w:"sky blue"},
{e:"🌌",n:"Night",c:"#4b4bd6",w:"indigo"},
{e:"🍇",n:"Grape",c:"#a85be0",w:"violet"},
{e:"🌸",n:"Blossom",c:"#ff9ed0",w:"pink"}];
var FREQ=[262,294,330,392,440,523,587,659];
var CH=[
{t:"The Meeting",n:3,s:"Where it all began. Light the memory in order."},
{t:"First Date",n:4,s:"Nervous laughs and shared dessert."},
{t:"The Proposal",n:5,s:"A question that changed everything."},
{t:"The Wedding Day",n:6,s:"Two families, one beautiful blur."},
{t:"Home",n:7,s:"The last lantern lights the way to your front door."},
{t:"Bonus: The Next Adventure",n:6,sh:1,s:"The orbs dance now. Keep your eyes on the colors!"},
{t:"Bonus: Forever",n:8,sh:1,s:"Every lantern, every memory, dancing. One last time."}];
var MAIN=5;
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(arr,r){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function level(L,st){var r=rng(1000+L*77),all=[0,1,2,3,4,5,6,7];var lay=shuf(all,r),seq=shuf(all,r).slice(0,CH[L].n);
  if(CH[L].sh)lay=shuf(all,rng(5000+L*31+(st||0)));return{layout:lay,seq:seq}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

var app=document.getElementById("app");
var S={stage:"lobby",code:"",name:"",side:"sun",lvl:0,step:0,mis:0,flash:null,msg:"",room:null,roomApi:undefined,err:"",
 story:["","","","",""],note:"",muted:false,hug:0,seenHug:0,lastPS:0,lastPM:0,lastLvl:-1,toast:"",seenHome:false,AC:null};
function rand4(){var a="ABCDEFGHJKMNPQRSTUVWXYZ",s="";for(var i=0;i<4;i++)s+=a[Math.floor(Math.random()*a.length)];return s}
S.code=rand4();
try{var sv=JSON.parse(localStorage.getItem("tl")||"{}");if(sv.name)S.name=sv.name;if(sv.story)S.story=sv.story;if(sv.note)S.note=sv.note;if(sv.side)S.side=sv.side}catch(e){}
function save(){try{localStorage.setItem("tl",JSON.stringify({name:S.name,story:S.story,note:S.note,side:S.side}))}catch(e){}}

S.roomApi=window.mqtt?{join:p2pJoin}:null;
function tls(t){window.TLS=t;if(S.stage==="play")render()}
function p2pJoin(name){return new Promise(function(res,rej){
  var topic="twolanterns/v1/"+name.slice(3),cid=Math.random().toString(36).slice(2,10),mine={},remotes={},cbs=[],done=false,c=null,bi=0,last="";
  var brokers=["wss://broker.hivemq.com:8884/mqtt","wss://broker.emqx.io:8084/mqtt","wss://test.mosquitto.org:8081"];
  function live(){var b=null,now=Date.now();for(var k in remotes){if(now-remotes[k].t<7000&&(!b||remotes[k].t>b.t))b=remotes[k]}return b}
  function fire(){var l=live(),sig=l?JSON.stringify(l.d):"";cbs.forEach(function(f){f()});last=sig}
  function send(){if(c&&c.connected)c.publish(topic+"/"+cid,JSON.stringify(mine))}
  var shim={peers:function(){var a=[{isMe:true,kind:"viewer",presence:mine}],l=live();if(l)a.push({isMe:false,kind:"viewer",presence:l.d});return a},
   onPeers:function(f){cbs.push(f)},presence:function(o){mine=o;send();return Promise.resolve()}};
  function go(){
    var url=brokers[bi%brokers.length];tls("Connecting to server "+(bi%brokers.length+1)+" of "+brokers.length+"…");
    var cc=mqtt.connect(url,{clientId:"tl-"+cid+"-"+bi,reconnectPeriod:2000,connectTimeout:6000,clean:true});c=cc;
    var t=setTimeout(function(){if(!cc.connected){cc.end(true);bi++;go()}},7000);
    cc.on("connect",function(){clearTimeout(t);tls("Connected. Waiting for your partner…");cc.subscribe(topic+"/+");send();if(!done){done=true;res(shim)}});
    cc.on("message",function(tp,m){var id=tp.split("/").pop();if(id===cid)return;var d;try{d=JSON.parse(m.toString())}catch(e){return}var isNew=!live();remotes[id]={d:d,t:Date.now()};if(isNew)send();fire()});
    cc.on("close",function(){if(cc.connected===false&&done)tls("Connection lost. Reconnecting…")});
  }
  go();
  setInterval(function(){send();var had=last!=="";var l=live();if(had&&!l){fire()}},2000);
  setTimeout(function(){if(!done){done=true;rej()}},25000);
})}

/* sound */
function ac(){try{if(!S.AC){var C=window.AudioContext||window.webkitAudioContext;S.AC=new C()}if(S.AC.state==="suspended")S.AC.resume();return S.AC}catch(e){return null}}
function tone(f,d,type,delay,vol){if(S.muted)return;var c=ac();if(!c)return;var t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.18,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+0.05)}
function sNote(k){tone(FREQ[k],0.5,"sine",0,0.2);tone(FREQ[k]*2,0.3,"triangle",0,0.05)}
function sBad(){tone(110,0.35,"sawtooth",0,0.1);tone(98,0.4,"sawtooth",0.12,0.1)}
function sWin(){[523,659,784,1047].forEach(function(f,i){tone(f,0.6,"sine",i*0.14,0.2)})}
function sHug(){tone(660,0.4,"sine",0,0.15);tone(880,0.5,"sine",0.18,0.15)}
function vib(n){try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}}

function partner(){if(!S.room)return null;var ps=S.room.peers();for(var i=0;i<ps.length;i++){var p=ps[i];if(!p.isMe&&p.kind==="viewer"&&p.presence&&p.presence.side)return p}return null}
function pub(){if(S.room)S.room.presence({side:S.side,name:S.name.slice(0,20),lvl:S.lvl,step:S.step,mis:S.mis,hug:S.hug,note:S.note.slice(0,160),story:S.story.map(function(x){return x.slice(0,70)})}).catch(function(){})}
function tapperSide(L){return L%2===0?"moon":"sun"}
function say(t){S.toast=t;render();setTimeout(function(){if(S.toast===t){S.toast="";render()}},2600)}
function story(i,p){return S.story[i]||(p&&p.presence.story&&p.presence.story[i])||CH[i].s}

async function join(){
  if(!S.roomApi)return;
  S.err="";ac();save();
  try{
    S.room=await S.roomApi.join("tl-"+S.code.toLowerCase());
    S.stage="play";S.lvl=0;S.step=0;S.mis=0;
    S.room.onPeers(function(){sync()});
    pub();render();
  }catch(e){S.err="Couldn’t connect. Check your internet and try again.";render()}
}
function sync(){
  var p=partner();
  if(p&&typeof p.presence.lvl==="number"&&p.presence.lvl>S.lvl){S.lvl=p.presence.lvl;S.step=0;S.msg="";sWin();pub()}
  if(p&&typeof p.presence.hug==="number"&&p.presence.hug>S.seenHug){S.seenHug=p.presence.hug;sHug();vib(60);floatHeart();say("💗 "+(p.presence.name||"Your love")+" sent you a hug")}
  render();
}
function floatHeart(){var d=document.createElement("div");d.className="float";d.textContent="💗";document.body.appendChild(d);setTimeout(function(){d.remove()},2100)}
function sendHug(){ac();S.hug=Date.now();pub();floatHeart();sHug()}
function tap(i){
  if(S.lvl>=CH.length||tapperSide(S.lvl)!==S.side)return;
  ac();
  var L=level(S.lvl,S.step),want=L.seq[S.step];
  if(i===want){
    S.flash={i:i,ok:true};S.step++;S.msg="";sNote(i);vib(15);
    if(S.step>=L.seq.length){S.lvl++;S.step=0;setTimeout(sWin,300)}
  }else{
    S.flash={i:i,ok:false};S.step=0;S.mis++;S.msg="Oh no — back to the start of this memory 💫";sBad();vib([60,40,60]);
  }
  pub();render();
  setTimeout(function(){S.flash=null;render()},480);
}
function setSide(s){S.side=s;save();pub();render()}

function render(){
  var t=S.toast?'<div class="toast">'+esc(S.toast)+'</div>':'';
  if(S.stage==="lobby"){lobby();return}
  var p=partner();
  if(S.lvl>=CH.length){winView(p)}
  else if(!p||p.presence.side===S.side){waiting(p)}
  else if(S.lvl===MAIN&&!S.seenHome&&!(p.presence.lvl===MAIN&&p.presence.step>0)&&!(p.presence.lvl>MAIN)){homeView(p)}
  else{game(p)}
  if(t)app.insertAdjacentHTML("afterbegin",t);
}
function lobby(){
  var nope=S.roomApi===null;
  app.innerHTML='<div class="lanterns">🏮✨🏮</div><h1>Two Lanterns</h1><p class="sub">A little game for two, played on two phones. Neither of you can win alone.</p>'+
  '<div class="panel"><label>Your first name</label><input id="nm" maxlength="20" value="'+esc(S.name)+'" placeholder="e.g. Layla"></div>'+
  '<div class="panel"><label>Pick your lantern</label><div class="row"><button class="side alt'+(S.side==="sun"?" sel":"")+'" data-s="sun">☀️ Sun</button><button class="side alt'+(S.side==="moon"?" sel":"")+'" data-s="moon">🌙 Moon</button></div><p class="note" style="margin-top:8px">Your partner picks the other one.</p></div>'+
  '<details class="panel"><summary>✍️ Make it yours (optional)</summary><p class="note" style="margin:8px 0 0">Write one line per memory. Either of you can fill these in.</p>'+
  ["Where you met","Your first date","The proposal","Your wedding day","Your home"].map(function(l,i){return'<input class="st" data-k="'+i+'" maxlength="70" value="'+esc(S.story[i])+'" placeholder="'+l+'…">'}).join("")+
  '<input id="nt" maxlength="160" value="'+esc(S.note)+'" placeholder="A secret note for your partner at the end 💌"></details>'+
  '<div class="panel"><label>Room code (same on both phones)</label><input id="cd" maxlength="8" value="'+esc(S.code)+'" autocapitalize="characters"></div>'+
  (nope?'<p class="note">Couldn’t load the connection library. Check your internet and refresh.</p>':'')+
  '<p class="msg">'+esc(S.err)+'</p><button class="big" id="go"'+(S.roomApi?"":" disabled")+'>Light the lanterns</button>';
  var nm=document.getElementById("nm"),cd=document.getElementById("cd"),nt=document.getElementById("nt");
  nm.oninput=function(){S.name=nm.value};nt.oninput=function(){S.note=nt.value};
  cd.oninput=function(){S.code=cd.value.replace(/[^A-Za-z0-9]/g,"")};
  Array.prototype.forEach.call(app.querySelectorAll(".st"),function(i){i.oninput=function(){S.story[+i.dataset.k]=i.value}});
  Array.prototype.forEach.call(app.querySelectorAll("[data-s]"),function(b){b.onclick=function(){S.side=b.dataset.s;Array.prototype.forEach.call(app.querySelectorAll("[data-s]"),function(x){x.classList.toggle("sel",x===b)})}});
  document.getElementById("go").onclick=function(){S.code=cd.value||rand4();join()};
}
function waiting(p){
  var clash=p&&p.presence.side===S.side;
  app.innerHTML='<div class="lanterns">'+(S.side==="sun"?"☀️":"🌙")+'</div><h2>'+(clash?"You both picked the same lantern":"Waiting for your person…")+'</h2>'+
  '<p class="sub">'+(clash?"One of you, tap the other lantern below.":"Have them open this page and enter the code below.")+'</p>'+
  '<div class="card" style="text-align:center;font-size:2rem;letter-spacing:.3em;font-weight:700">'+esc(S.code.toUpperCase())+'</div>'+
  '<div class="row"><button class="side alt'+(S.side==="sun"?" sel":"")+'" data-s="sun">☀️ Sun</button><button class="side alt'+(S.side==="moon"?" sel":"")+'" data-s="moon">🌙 Moon</button></div><p class="note">'+esc(window.TLS||"")+'</p>';
  Array.prototype.forEach.call(app.querySelectorAll("[data-s]"),function(b){b.onclick=function(){setSide(b.dataset.s)}});
}
function game(p){
  var L=level(S.lvl,S.lvl===S.lastLvl&&tapperSide(S.lvl)===S.side?S.step:(p.presence.lvl===S.lvl?p.presence.step||0:0)),ch=CH[S.lvl],isTapper=tapperSide(S.lvl)===S.side;
  var pStep=(p.presence.lvl===S.lvl&&typeof p.presence.step==="number")?p.presence.step:0;
  var pm=typeof p.presence.mis==="number"?p.presence.mis:0;
  if(S.lvl!==S.lastLvl){S.lastLvl=S.lvl;S.lastPS=0;S.lastPM=pm}
  if(!isTapper){
    if(pStep>S.lastPS&&pStep<=L.seq.length){sNote(L.seq[pStep-1])}
    if(pm>S.lastPM){sBad();S.msg="That wasn’t it. They’re back at the start, so read the order again."}
    else if(pStep>S.lastPS)S.msg="";
    S.lastPS=pStep;S.lastPM=pm;
  }
  var step=isTapper?S.step:pStep,mis=S.mis+pm,pn=p.presence.name||"your love";
  var h='<div class="top"><span class="chap">Memory '+(S.lvl+1)+' of '+CH.length+' · 💔 '+mis+'</span><button class="alt mini" id="mu">'+(S.muted?"🔇":"🔊")+'</button></div>'+
  '<h2>'+esc(ch.t)+'</h2><p class="sub">'+esc(S.lvl<MAIN?story(S.lvl,p):ch.s)+'</p>'+
  '<div class="bar">'+L.seq.map(function(_,i){return'<span class="pip'+(i<step?" on":"")+'"></span>'}).join("")+'</div>';
  if(isTapper){
    h+='<div class="role">🪄 You tap the orbs. '+esc(pn)+' knows the order. Ask them!</div>'+
    '<div class="orbs">'+L.layout.map(function(k){var f=S.flash&&S.flash.i===k?(S.flash.ok?" ok":" bad"):"";return'<button class="orb'+f+'" style="--c:'+PAL[k].c+'" data-i="'+k+'" aria-label="orb"></button>'}).join("")+'</div>'+
    '<p class="msg">'+esc(S.msg)+'</p>'+(ch.sh?'<p class="note">The orbs rearrange after every tap. Go by color, not position.</p>':'<p class="note">Talk it through out loud or on a call. You can’t see the clues.</p>');
  }else{
    h+='<div class="role">📖 You hold the memory. Tell '+esc(pn)+' which colors to tap, in order.</div>'+
    '<div class="card seq">'+L.seq.map(function(k,i){return'<div class="step'+(i<step?" done":i===step?" now":"")+'"><span class="n">'+(i+1)+'</span><span class="e">'+PAL[k].e+'</span><span>'+PAL[k].n+'</span></div>'}).join("")+'</div>'+
    '<div class="panel"><label>What each symbol glows as</label><div class="legend">'+PAL.map(function(x){return'<span>'+x.e+' '+x.n+' = <b>'+x.w+'</b></span>'}).join("")+'</div></div>'+
    '<p class="msg">'+esc(S.msg)+'</p>';
  }
  h+='<button class="alt big" id="hg">💗 Send a hug</button>';
  app.innerHTML=h;
  Array.prototype.forEach.call(app.querySelectorAll(".orb"),function(b){b.onclick=function(){tap(parseInt(b.dataset.i,10))}});
  document.getElementById("hg").onclick=sendHug;
  document.getElementById("mu").onclick=function(){S.muted=!S.muted;render()};
}
function homeView(p){
  app.innerHTML='<div class="win"><div class="big">🏠💞</div><h1>You’re Home</h1><p class="sub">The five memories are lit, '+esc(S.name||"love")+'. But the night isn’t over. Two bonus chapters are waiting, and they’re trickier.</p>'+
  '<button class="big" id="bn">Play the bonus memories</button><button class="alt big" id="hg">💗 Send a hug</button></div>';
  document.getElementById("bn").onclick=function(){ac();S.seenHome=true;render()};
  document.getElementById("hg").onclick=sendHug;
}
function winView(p){
  var mis=S.mis+(p&&typeof p.presence.mis==="number"?p.presence.mis:0),nn=p&&p.presence.note,pn=(p&&p.presence.name)||"Your partner";
  app.innerHTML='<div class="win"><div class="big">🏮💞🏮</div><h1>Forever</h1><p class="sub">Every lantern is lit. You did it together, which is the only way it ever works.</p>'+
  (nn?'<div class="card"><p><b>A note from '+esc(pn)+':</b><br>“'+esc(nn)+'”</p></div>':'')+
  '<div class="card"><p>Wrong turns on the way: <b>'+mis+'</b> 💔<br>Happily ever after: <b>just beginning</b> ✨</p></div>'+
  '<button class="alt big" id="hg">💗 Send a hug</button><p class="note">Want to play again? Reopen the page with a fresh room code.</p></div>';
  document.getElementById("hg").onclick=sendHug;
  if(S.lastLvl!==-2){S.lastLvl=-2;sWin()}
}
render();
</script>
</body>
</html>
